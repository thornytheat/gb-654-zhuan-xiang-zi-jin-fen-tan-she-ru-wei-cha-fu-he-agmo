{% extends "base.html" %}{% block content %}
<div class="grid module-7"><section class="panel panel--primary"><div class="panel__head"><h2>公示与封存记录</h2><span class="panel__meta">M7 · {{ data.status|default('READY') }}</span></div><div class="panel__body panel__body--scroll"><table class="ledger"><thead><tr><th>字段</th><th>值</th><th>证据</th></tr></thead><tbody>{% for key, value in data.items() %}<tr><td>{{ key }}</td><td class="num">{{ value }}</td><td>R{{ loop.index }}</td></tr>{% endfor %}</tbody></table></div></section>
<div class="stack"><section class="panel"><div class="panel__head"><h2>权限边界</h2><span class="panel__meta">公示公开 · 原件审计</span></div><div class="panel__body bars"><i style="--v:64%"></i><i style="--v:32%"></i></div></section><section class="panel"><div class="panel__head"><h2>本次动作</h2><span class="panel__meta">/api/disclosures</span></div><div class="panel__body"><button class="btn btn--primary" data-endpoint="/api/disclosures">查看公示</button><pre class="result">等待运行</pre></div></section></div></div>
{% endblock %}
